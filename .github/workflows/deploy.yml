name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order. A later push waits instead of cancelling a half-done deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    env:
      # All three secrets must exist before anything touches production. Until then the job only
      # proves that main tests and builds (test and deploy document §8).
      HAS_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.NEON_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Migrations first: a Worker that expects a table the database does not have yet would fail
      # every sign-in. If this step fails, the steps below do not run.
      - name: Migrate Neon
        if: env.HAS_DEPLOY == 'true'
        run: npm run db:migrate --workspace apps/api
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Deploy api (api.stairno.com)
        if: env.HAS_DEPLOY == 'true'
        run: npm run deploy --workspace apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy account (account.stairno.com)
        if: env.HAS_DEPLOY == 'true'
        run: npm run deploy --workspace apps/account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped
        if: env.HAS_DEPLOY != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and NEON_DATABASE_URL are not all set. Tests passed, deploy skipped."
