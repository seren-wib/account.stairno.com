name = "stairno-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare creates the DNS record and certificate on deploy (test and deploy document §8.1).
routes = [{ pattern = "api.stairno.com", custom_domain = true }]

# Run next to Neon (AWS ap-southeast-1) instead of the colo that received the request, so each
# query stays in-region (NFR-1). Smart mode needs steady traffic from several locations to decide.
[placement]
region = "aws:ap-southeast-1"

[vars]
API_URL = "https://api.stairno.com"
ACCOUNT_URL = "https://account.stairno.com"
HUB_URL = "https://stairno.com"
COOKIE_DOMAIN = "stairno.com"
# test until business registration (roadmap step 9); off stops payments and nothing else (FR-42).
PAYMENTS_MODE = "test"

[observability]
enabled = true

# FR-57: subscription renewals, once a day at 00:00 UTC (09:00 KST).
[triggers]
crons = ["0 0 * * *"]

# FR-62: desktop builds, streamed through signed download links (SDD §6.8).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "stairno-downloads"

# FR-85: profile photos, served by the API at /v1/avatars (SDD §7.6).
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "stairno-avatars"
