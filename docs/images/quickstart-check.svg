<svg xmlns="http://www.w3.org/2000/svg" width="900" height="188" viewBox="0 0 900 188" role="img" aria-label="Terminal output">
  <rect width="900" height="188" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="450" y="23" text-anchor="middle" fill="#8b949e" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">account.stairno.com</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" fill="#e6edf3">
    <text x="24" y="64" xml:space="preserve">$ curl -s localhost:8787/health</text>
    <text x="24" y="84" xml:space="preserve">{"status":"<tspan fill="#3fb950">ok</tspan>"}</text>
    <text x="24" y="104" xml:space="preserve">$ curl -s localhost:8787/auth/.well-known/openid-configuration | grep -o '"issuer":"[^"]*"'</text>
    <text x="24" y="124" xml:space="preserve">"issuer":"http://localhost:8787/auth"</text>
    <text x="24" y="144" xml:space="preserve">$ curl -sI localhost:4321/en/sign-up | head -1</text>
    <text x="24" y="164" xml:space="preserve">HTTP/1.1 200 <tspan fill="#3fb950">OK</tspan></text>
  </g>
</svg>
